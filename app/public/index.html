<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Container App</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0f1117;
      color: #e2e8f0;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2rem;
      padding: 2rem;
    }

    .card {
      background: #1a1d27;
      border: 1px solid #2d3148;
      border-radius: 16px;
      padding: 2.5rem 3rem;
      max-width: 560px;
      width: 100%;
      text-align: center;
    }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 0.4rem;
      background: #16a34a22;
      color: #4ade80;
      border: 1px solid #4ade8044;
      border-radius: 999px;
      font-size: 0.78rem;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 0.3rem 0.9rem;
      margin-bottom: 1.5rem;
      text-transform: uppercase;
    }

    .badge::before {
      content: '';
      width: 8px;
      height: 8px;
      background: #4ade80;
      border-radius: 50%;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.3; }
    }

    h1 {
      font-size: 1.8rem;
      font-weight: 700;
      margin-bottom: 0.6rem;
      background: linear-gradient(135deg, #e2e8f0, #94a3b8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }

    p {
      color: #64748b;
      font-size: 0.95rem;
      line-height: 1.6;
      margin-bottom: 2rem;
    }

    .stats {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 1rem;
      margin-bottom: 2rem;
    }

    .stat {
      background: #0f1117;
      border: 1px solid #2d3148;
      border-radius: 10px;
      padding: 1rem;
    }

    .stat-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.08em;
      color: #475569;
      margin-bottom: 0.3rem;
    }

    .stat-value {
      font-size: 1rem;
      font-weight: 600;
      color: #cbd5e1;
      font-variant-numeric: tabular-nums;
    }

    .actions {
      display: flex;
      gap: 0.75rem;
      justify-content: center;
      flex-wrap: wrap;
    }

    button {
      padding: 0.6rem 1.4rem;
      border-radius: 8px;
      font-size: 0.875rem;
      font-weight: 500;
      cursor: pointer;
      border: none;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }

    .btn-primary { background: #3b82f6; color: #fff; }
    .btn-ghost {
      background: transparent;
      color: #94a3b8;
      border: 1px solid #2d3148;
    }

    footer {
      font-size: 0.78rem;
      color: #334155;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="badge">Running</div>
    <h1>Container App</h1>
    <p>Sample web application running on Azure Container Apps,<br>served through Cloudflare on port 3000.</p>

    <div class="stats">
      <div class="stat">
        <div class="stat-label">Port</div>
        <div class="stat-value" id="port">3000</div>
      </div>
      <div class="stat">
        <div class="stat-label">Uptime</div>
        <div class="stat-value" id="uptime">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Version</div>
        <div class="stat-value" id="version">—</div>
      </div>
      <div class="stat">
        <div class="stat-label">Environment</div>
        <div class="stat-value" id="env">—</div>
      </div>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="loadInfo()">Refresh</button>
      <button class="btn-ghost" onclick="window.open('/healthz')">Health check</button>
    </div>
  </div>

  <footer>Azure Container Apps &middot; Cloudflare &middot; ACR</footer>

  <script>
    function formatUptime(seconds) {
      const h = Math.floor(seconds / 3600);
      const m = Math.floor((seconds % 3600) / 60);
      const s = seconds % 60;
      if (h > 0) return `${h}h ${m}m`;
      if (m > 0) return `${m}m ${s}s`;
      return `${s}s`;
    }

    async function loadInfo() {
      try {
        const res = await fetch('/api/info');
        const data = await res.json();
        document.getElementById('port').textContent    = data.port;
        document.getElementById('uptime').textContent  = formatUptime(data.uptime);
        document.getElementById('version').textContent = data.version;
        document.getElementById('env').textContent     = data.environment;
      } catch {
        document.getElementById('uptime').textContent = 'error';
      }
    }

    loadInfo();
    setInterval(loadInfo, 10000);
  </script>
</body>
</html>
